/* ---------------- collections: herbarium & bouquet (Task 9) ---------------- */
// A bloom is pressed into the herbarium once, on the date it actually
// bloomed (plantedAt + bloomAt) — never the date it was noticed, so a
// flower that blooms while she is away keeps its true day. The bouquet
// can only hold flowers she has actually grown: picks come from the
// herbarium, at most three, plus one wish she writes herself. Sharing is
// offline by construction: navigator.share, then the clipboard, and
// nothing here ever touches the network.
const BOUQUET_MAX = 3;
const BOUQUET_EMOJI = { moonflower: "🌕", tulip: "🌷", lavender: "💜",
  sunflower: "🌻", nightjasmine: "🤍", cherryblossom: "🌸" };
const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function prettyDate(key) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || "");
  if (!m) return key || "";
  return (+m[3]) + " " + MONTHS_SHORT[+m[2] - 1] + " " + m[1];
}

// Fill in Task 9 fields for states saved before this task existed.
function ensureHerbariumFields() {
  if (!state) return;
  if (!state.herbarium || typeof state.herbarium !== "object") state.herbarium = {};
}
function ensureBouquetFields() {
  if (!state) return;
  if (!state.bouquet || typeof state.bouquet !== "object") state.bouquet = { blooms: [], wish: "" };
  if (!Array.isArray(state.bouquet.blooms)) state.bouquet.blooms = [];
  if (typeof state.bouquet.wish !== "string") state.bouquet.wish = "";
}

// Record a species' first bloom. Returns true only when a new entry was
// added — a second bloom of the same species keeps the first date.
function recordBloom(species, bloomAtMs) {
  ensureHerbariumFields();
  if (!PLANTS[species] || state.herbarium[species]) return false;
  state.herbarium[species] = todayKey(bloomAtMs === undefined ? Date.now() : bloomAtMs);
  saveState(state);
  renderHerbarium();
  return true;
}

// The herbarium lists all six species: bloomed ones with their first-bloom
// date, the rest as "still waiting" — a collection to complete, never a
// punishment for what hasn't bloomed yet.
function renderHerbarium() {
  const list = $("herbarium-list");
  if (!list) return; // same guard pattern as renderHUD (old test harnesses)
  ensureHerbariumFields();
  list.innerHTML = "";
  const found = Object.keys(state.herbarium).length;
  const head = $("herbarium-head");
  if (head) head.textContent = "Herbarium 🌸 " + found + " of " + Object.keys(PLANTS).length + " pressed";
  for (const key of Object.keys(PLANTS)) {
    const row = document.createElement("div");
    row.className = "herb-row" + (state.herbarium[key] ? "" : " herb-locked");
    const name = document.createElement("span");
    name.className = "herb-name";
    name.textContent = (BOUQUET_EMOJI[key] || "🌸") + " " + PLANTS[key].name;
    const date = document.createElement("span");
    date.className = "herb-date";
    date.textContent = state.herbarium[key]
      ? "first bloomed " + prettyDate(state.herbarium[key])
      : "still waiting to bloom…";
    row.appendChild(name);
    row.appendChild(date);
    list.appendChild(row);
  }
}

// Pick or unpick a bloomed species for the bouquet. Only herbarium
// species can be picked, and a bouquet holds three blooms at most.
function toggleBouquet(species) {
  ensureHerbariumFields();
  ensureBouquetFields();
  if (!PLANTS[species]) return false;
  if (!state.herbarium[species]) { toast("That flower hasn't bloomed yet — grow it first 🌸"); return false; }
  const at = state.bouquet.blooms.indexOf(species);
  if (at >= 0) {
    state.bouquet.blooms.splice(at, 1);
  } else {
    if (state.bouquet.blooms.length >= BOUQUET_MAX) { toast("A bouquet holds three blooms 💐"); return false; }
    state.bouquet.blooms.push(species);
  }
  saveState(state);
  renderBouquet();
  return true;
}

// Her wish, saved as she types it (trimmed, capped at the input's length).
function setBouquetWish(text) {
  ensureBouquetFields();
  state.bouquet.wish = String(text || "").trim().slice(0, 120);
  saveState(state);
  renderBouquet();
  return state.bouquet.wish;
}

// The share text: the picked blooms, her wish, signed in Suhail's voice.
// Null when nothing is picked — a wish alone is not a bouquet.
function buildBouquet() {
  ensureBouquetFields();
  ensureHerbariumFields();
  const blooms = state.bouquet.blooms.filter((s) => PLANTS[s]);
  if (!blooms.length) return null;
  const lines = ["💐 A bouquet from our garden, for my princess:"];
  for (const s of blooms) lines.push((BOUQUET_EMOJI[s] || "🌸") + " " + PLANTS[s].name);
  lines.push("");
  if (state.bouquet.wish) lines.push("My wish: " + state.bouquet.wish);
  lines.push("— with all my love, Suhail ji ♥");
  return lines.join("\n");
}

// Share the bouquet: the native share sheet when it exists, the clipboard
// when it doesn't (or when sharing fails), and a plain "ready" otherwise.
// No fetch, no XHR, no network anywhere on this path.
async function shareBouquet() {
  const text = buildBouquet();
  if (!text) { toast("Pick some blooms first 💐"); return null; }
  const nav = (typeof navigator !== "undefined") ? navigator : null;
  if (nav && typeof nav.share === "function") {
    try {
      await nav.share({ text });
      toast("Shared with love 💐");
      return "shared";
    } catch (e) {
      // Task 10: a cancelled share is her choice, not a failure — report
      // it and stop; only an unavailable share sheet falls to the clipboard.
      if (e && e.name === "AbortError") {
        toast("Share cancelled — your bouquet is still here 💐");
        return "cancelled";
      }
    }
  }
  if (nav && nav.clipboard && typeof nav.clipboard.writeText === "function") {
    try {
      await nav.clipboard.writeText(text);
      toast("Copied — send it to Suhail ji 💐");
      return "copied";
    } catch (e) { /* fall through */ }
  }
  toast("Your bouquet is ready to share 💐");
  return "ready";
}

function renderBouquet() {
  const picks = $("bouquet-picks");
  if (!picks) return; // same guard pattern as renderHUD (old test harnesses)
  ensureHerbariumFields();
  ensureBouquetFields();
  picks.innerHTML = "";
  const bloomed = Object.keys(PLANTS).filter((s) => state.herbarium[s]);
  for (const s of bloomed) {
    const b = document.createElement("button");
    const picked = state.bouquet.blooms.includes(s);
    b.className = "bouquet-pick" + (picked ? " picked" : "");
    b.textContent = (BOUQUET_EMOJI[s] || "🌸") + " " + PLANTS[s].name;
    b.setAttribute("aria-pressed", picked ? "true" : "false");
    b.addEventListener("click", () => toggleBouquet(s));
    picks.appendChild(b);
  }
  const wishInput = $("bouquet-wish");
  // Task 10: never rewrite the input while she is typing in it — the
  // trim-and-write-back moved the cursor and ate trailing spaces.
  if (wishInput && document.activeElement !== wishInput && wishInput.value !== state.bouquet.wish) {
    wishInput.value = state.bouquet.wish || "";
  }
  const preview = $("bouquet-preview");
  if (preview) {
    const text = buildBouquet();
    preview.textContent = text || "Pick up to three blooms from your herbarium, write a wish, and share it with Suhail ji 💐";
  }
  const shareBtn = $("bouquet-share");
  if (shareBtn) shareBtn.disabled = state.bouquet.blooms.length === 0;
}

/* ---------------- milestone letters (Task 10) ---------------- */
// Season 2 letters from Suhail, days 7/14/21/27 — drafted in Task 10 in
// Suhail's voice, verbatim from the plan file, for Sohel's approval.
// Season 1's pattern: locked until their day, mailbox flag rises while
// one is unread, tapping the mailbox marks them read and jumps to them.
function gardenDay() { return (state.dayCount || 0) + 1; } // 1-based: dayCount 0 is day 1
function milestoneKeys() { return Object.keys(CONFIG.milestones).map(Number).sort((a, b) => a - b); }
function milestoneUnlocked(day) {
  if (isPreviewMode()) return true; // preview shows a mature garden
  return gardenDay() >= day;
}
function unreadLetters() {
  ensureLetterFields();
  return milestoneKeys().filter((k) => milestoneUnlocked(k) && !state.lettersRead.includes(k));
}
function ensureLetterFields() {
  if (!state) return;
  if (!Array.isArray(state.lettersRead)) state.lettersRead = [];
  if (!Array.isArray(state.lettersAnnounced)) state.lettersAnnounced = [];
}
function renderMailbox() {
  const flag = $("mail-flag");
  if (!flag) return; // same guard pattern as renderHUD (old test harnesses)
  flag.style.transform = unreadLetters().length ? "rotate(0deg)" : "rotate(24deg)";
}
function renderLetters() {
  const list = $("letters-list");
  if (!list) return; // same guard pattern as renderHUD (old test harnesses)
  ensureLetterFields();
  list.innerHTML = "";
  const head = $("letters-head");
  const unread = unreadLetters().length;
  if (head) head.textContent = unread ? "Letters from Suhail 💌 (" + unread + " new)" : "Letters from Suhail 💌";
  for (const k of milestoneKeys()) {
    const m = CONFIG.milestones[k], open = milestoneUnlocked(k);
    const div = document.createElement("div");
    div.className = "letter" + (open ? "" : " locked");
    div.setAttribute("data-day", k);
    const t = document.createElement("div"); t.className = "day";
    t.textContent = open ? m.title : "🔒 Opens on day " + k;
    div.appendChild(t);
    if (open) {
      const tx = document.createElement("div"); tx.className = "text";
      tx.textContent = m.text; div.appendChild(tx);
      div.setAttribute("tabindex", "0");
      div.setAttribute("role", "button");
      div.setAttribute("aria-label", "Letter from Suhail, day " + k + " — tap to mark it read");
      const markRead = () => markLetterRead(k);
      div.addEventListener("click", markRead);
      div.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); markRead(); }
      });
    }
    list.appendChild(div);
  }
}
function markLetterRead(day) {
  ensureLetterFields();
  if (!milestoneUnlocked(day)) return false;
  if (state.lettersRead.includes(day)) return false;
  state.lettersRead.push(day);
  saveState(state);
  renderLetters();
  renderMailbox();
  // Task 11: the re-render rebuilds the list — put focus back on the row
  // she just read, so a keyboard user does not land back at the top.
  const list = $("letters-list");
  const row = list && list.querySelector('[data-day="' + day + '"]');
  if (row && typeof row.focus === "function") row.focus();
  return true;
}
// A letter newly unlocked since the last open: an envelope flies to the
// mailbox (Season 1's letterArrives) and a toast points at the mailbox.
// Announced once per day — reopening the garden never re-flies it.
function announceNewLetters() {
  ensureLetterFields();
  if (isPreviewMode()) return []; // preview is display-only: no envelope, no toast, nothing recorded
  const newly = milestoneKeys().filter((k) => milestoneUnlocked(k) && !state.lettersAnnounced.includes(k));
  if (!newly.length) return [];
  newly.forEach((k) => state.lettersAnnounced.push(k));
  saveState(state);
  if (!REDUCED) newly.forEach((k, i) => setTimeout(letterArrives, 900 + i * 1100));
  setTimeout(() => toast("💌 " + (newly.length > 1 ? newly.length + " letters" : "A letter") +
    " from Suhail arrived — tap the mailbox!"), 1000);
  return newly;
}
function letterArrives() {
  const layer = $("fx-layer");
  if (!layer) return;
  const e = document.createElement("div");
  e.className = "env-fly";
  e.textContent = "✉️";
  layer.appendChild(e);
  setTimeout(() => e.remove(), 2400);
}
// Mailbox tap: marks every unlocked letter read and jumps to the letters.
function openMailbox() {
  ensureLetterFields();
  milestoneKeys().filter((k) => milestoneUnlocked(k)).forEach((k) => {
    if (!state.lettersRead.includes(k)) state.lettersRead.push(k);
  });
  saveState(state);
  renderLetters();
  renderMailbox();
  const sec = $("letters");
  if (sec && typeof sec.scrollIntoView === "function") sec.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---------------- music box lullaby (Task 10) ---------------- */
// Season 1's proven pattern: saniya-theme.mp3 first (same file, relative
// path), WebAudio music-box waltz fallback when the file is missing.
let audioCtx = null, musicBus = null, musicTimer = null, musicPlaying = false;
const NOTE_FREQ = { C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.0, B5:987.77, C6:1046.5,
                    G2:98.0, A2:110.0, C3:130.81, F2:87.31 };
// a slow music-box waltz, written for Saniya
const LULLABY = [
  ["E5",1],["G5",1],["C6",1],
  ["B5",1],["A5",1],["G5",1],
  ["A5",1],["C6",1],["B5",1],
  ["G5",2],["E5",1],
  ["F5",1],["E5",1],["D5",1],
  ["E5",1],["D5",1],["C5",1],
  ["D5",1],["E5",1],["G5",1],
  ["C6",2.5],[null,.5],
];
const BASSLINE = [
  ["C3",3],["G2",3],["A2",3],["C3",3],
  ["F2",3],["G2",3],["C3",3],["C3",3],
];
const BEAT = 0.5;
function ensureAudio() {
  if (audioCtx) return true;
  const AC = (typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext))
    || (typeof AudioContext !== "undefined" ? AudioContext : null);
  if (!AC) return false;
  try { audioCtx = new AC(); }
  catch (e) { return false; }
  musicBus = audioCtx.createGain();
  const delay = audioCtx.createDelay(1); delay.delayTime.value = 0.34;
  const fb = audioCtx.createGain(); fb.gain.value = 0.32;
  const wet = audioCtx.createGain(); wet.gain.value = 0.35;
  musicBus.connect(audioCtx.destination);
  musicBus.connect(delay); delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(audioCtx.destination);
  return true;
}
function musicNote(freq, when, dur, vol, bright) {
  const t = audioCtx.currentTime + when;
  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain(), g2 = audioCtx.createGain();
  o1.type = "triangle"; o1.frequency.value = freq;
  o2.type = "sine"; o2.frequency.value = freq * 2; g2.gain.value = bright ? 0.22 : 0.08;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicBus);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 1.6));
  o1.start(t); o2.start(t);
  o1.stop(t + Math.max(dur, 1.7)); o2.stop(t + Math.max(dur, 1.7));
}
function playLullabyOnce() {
  let when = 0.05;
  LULLABY.forEach(([n, b]) => {
    if (n) musicNote(NOTE_FREQ[n], when, b * BEAT, 0.2, true);
    when += b * BEAT;
  });
  const end = when;
  let bw = 0.05;
  BASSLINE.forEach(([n, b]) => {
    musicNote(NOTE_FREQ[n], bw, b * BEAT, 0.09, false);
    bw += b * BEAT;
  });
  return Math.max(end, bw);
}
let musicMode = "mp3"; // falls back to "synth" if saniya-theme.mp3 is missing
function setMusicIcon() {
  const btn = $("music-btn");
  if (!btn) return; // same guard pattern as renderHUD (old test harnesses)
  const a = $("garden-audio");
  const playing = musicMode === "mp3" ? (a ? !a.paused : false) : musicPlaying;
  btn.textContent = playing ? "⏸" : "🎵";
  btn.setAttribute("aria-label", playing ? "Pause music" : "Play music");
}
function toggleSynth() {
  if (!ensureAudio()) { toast("Audio isn't supported here"); return; }
  if (audioCtx.state === "suspended") audioCtx.resume();
  musicPlaying = !musicPlaying;
  if (musicPlaying) {
    const loop = () => {
      if (!musicPlaying) return;
      const total = playLullabyOnce();
      musicTimer = setTimeout(loop, total * 1000 + 900);
    };
    loop();
  } else clearTimeout(musicTimer);
  setMusicIcon();
}
function toggleMusic() {
  const a = $("garden-audio");
  if (musicMode === "mp3" && a) {
    if (a.paused) {
      try {
        const pr = a.play();
        if (pr && pr.then) pr.then(setMusicIcon).catch(() => { musicMode = "synth"; toggleSynth(); });
        else setMusicIcon();
      } catch (e) { musicMode = "synth"; toggleSynth(); }
    } else { a.pause(); setMusicIcon(); }
  } else {
    toggleSynth();
  }
}

/* ---------------- scene (Task 3) ---------------- */
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const REDUCED = typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

// Debug/preview hook, in keeping with Season 1's #preview hash:
// #hour=21 forces the night palette, #hour=10 forces morning.
function hourFromHash(h) {
  const m = /hour=(\d{1,2})/.exec(h || "");
  if (!m) return null;
  const n = +m[1];
  return (n >= 0 && n <= 23) ? n : null;
}
function periodForHour(h) {
  if (h >= 5 && h < 8) return "dawn";
  if (h >= 8 && h < 16) return "day";
  if (h >= 16 && h < 19) return "dusk";
  return "night"; // 19:00–04:59
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2800);
}

// Render one soil-bed plot slot per unlocked plot (3 at level 1).
// Plants themselves arrive in Task 4; Task 3 renders empty beds only.
// Beds share one row and shrink as plots unlock (up to 9): a fixed 10px
// gap keeps every bed inside the 400-wide viewBox with no overlap.
// At n=3 this is bit-identical to the original layout (w=92, gap=31).
function buildScene() {
  const plots = $("plots");
  plots.innerHTML = "";
  const n = state.unlocked.plots;
  const GAP = 10;
  const w = Math.min(92, (400 - GAP * (n + 1)) / n);
  const gap = (400 - n * w) / (n + 1);
  const s = w / 92; // scale all bed geometry with the bed width
  for (let i = 0; i < n; i++) {
    const cx = gap + w / 2 + i * (w + gap);
    const g = svgEl("g", { "class": "plot-slot", "data-plot": i, "data-species": "empty",
      tabindex: "0", role: "button", "aria-label": "Bed " + (i + 1) + " — tap to tend it" }, plots);
    g.addEventListener("click", () => selectPlot(i)); // Task 4: tap a bed to tend it
    g.addEventListener("keydown", (e) => { // Task 10: keyboard bed selection
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectPlot(i); }
    });
    svgEl("ellipse", { cx: cx, cy: 408, rx: 46 * s, ry: Math.max(7, 13 * s), fill: "#7d5c3e" }, g);
    svgEl("ellipse", { cx: cx - 4 * s, cy: 405, rx: 34 * s, ry: Math.max(5, 8 * s), fill: "#8f6d49", "class": "soil" }, g);
    svgEl("circle", { cx: cx - 22 * s, cy: 404, r: Math.max(1, 2.2 * s), fill: "#a5875f" }, g);
    svgEl("circle", { cx: cx + 18 * s, cy: 408, r: Math.max(1, 1.8 * s), fill: "#a5875f" }, g);
    svgEl("rect", { x: cx + 30 * s, y: 384, width: 4, height: 20, rx: 2, fill: "#8a5a38" }, g);
    svgEl("circle", { cx: cx + 32 * s, cy: 382, r: Math.max(2.5, 5 * s), fill: "#e8b64c" }, g);
  }
}

function spawnFireflies(n) {
  const layer = $("fx-layer");
  layer.querySelectorAll(".firefly").forEach((f) => f.remove());
  if (REDUCED) return; // respect prefers-reduced-motion: calm night, no drift
  for (let i = 0; i < n; i++) {
    const f = document.createElement("div");
    f.className = "firefly";
    f.style.left = (8 + Math.random() * 84) + "%";
    f.style.top = (18 + Math.random() * 55) + "%";
    f.style.animationDelay = (-Math.random() * 7) + "s";
    layer.appendChild(f);
  }
}

// Time of day drives the whole scene: morning bees + butterflies,
// night moonlight + fireflies + stars, winter mist at dawn.
function setTimeOfDay(hour) {
  const h = hour !== undefined ? hour
    : (hourFromHash(typeof location !== "undefined" ? location.hash : "") ?? new Date().getHours());
  let period = periodForHour(h);
  if (state.moonlight) period = "night"; // moonlight toggle forces night
  const night = period === "night";
  const skies = {
    dawn: "linear-gradient(180deg, #ffc9de 0%, #ffe3c8 55%, #fff3dd 100%)",
    day: "linear-gradient(180deg, #8fd4ff 0%, #cdeffb 55%, #f2fbff 100%)",
    dusk: "linear-gradient(180deg, #ff9d6b 0%, #ffc98f 50%, #ffe9c4 100%)",
    night: "linear-gradient(180deg, #10142e 0%, #232a52 55%, #3a3f66 100%)",
  };
  const bodies = { dawn: "#f7e3d3", day: "#f6ead9", dusk: "#f3d3b8", night: "#101736" };
  const inks = { dawn: "#5c3d2e", day: "#5c3d2e", dusk: "#5c3d2e", night: "#f6e9ee" };
  const wrap = $("scene-wrap");
  wrap.style.background = skies[period];
  wrap.dataset.period = period;
  document.body.style.background = bodies[period];
  document.body.style.color = inks[period];
  $("night-veil").setAttribute("opacity", night ? 0.42 : period === "dusk" ? 0.08 : 0);
  $("sun").style.display = night ? "none" : "";
  $("moon").style.display = night ? "" : "none";
  $("clouds").style.display = night ? "none" : "";
  $("birds").style.display = night ? "none" : "";
  $("sky-stars").style.display = night ? "" : "none";
  $("bfly1").style.display = night ? "none" : "";
  $("bfly2").style.display = night ? "none" : "";
  $("bee1").style.display = night ? "none" : "";
  $("mist").style.display = period === "dawn" ? "" : "none";
  document.querySelectorAll(".lantern-glow").forEach((l) => { l.style.display = night ? "" : "none"; });
  document.querySelectorAll(".cottage-window").forEach((w) => {
    w.setAttribute("fill", night ? "#ffd97a" : "#8fa3b8");
  });
  if (night) spawnFireflies(14); else spawnFireflies(0);
  return period;
}

function syncThemeBtn() {
  const b = $("theme-btn");
  b.textContent = state.moonlight ? "☀️" : "🌙";
  b.setAttribute("aria-label", state.moonlight ? "Show daylight" : "Show moonlight");
}
function toggleMoonlight() {
  state.moonlight = !state.moonlight;
  saveState(state);
  setTimeOfDay();
  syncThemeBtn();
  toast(state.moonlight ? "Moonlight on 🌙" : "Daylight returns ☀️");
}
function applyMotion() {
  document.documentElement.classList.toggle("reduced-motion", REDUCED);
}

/* ---------------- boot (scene) ---------------- */
// Guarded: the same script is also executed in node vm tests without a DOM.
if (typeof document !== "undefined") {
  applyMotion();
  buildScene();
  renderPlants();
  renderCareBar();
  // Daily loop (Task 5): day boundary first, then the overnight report,
  // then the day's reveal + quests. The modal only opens when a bloom
  // landed between opens (Task 10: the heading says so, honestly).
  ensureDailyFields();
  advanceDay();
  const _overnight = overnightReport();
  renderDailyCard();
  renderQuests();
  renderHUD();
  renderPlotBuy();
  renderShop();
  renderDecorations();
  renderHerbarium(); // Task 9: pressed blooms, first-bloom dates
  renderBouquet(); // Task 9: bouquet builder + share
  const _wish = $("bouquet-wish");
  if (_wish) _wish.addEventListener("input", (e) => setBouquetWish(e.target.value));
  const _share = $("bouquet-share");
  if (_share) _share.addEventListener("click", () => shareBouquet());
  renderLetters(); // Task 10: milestone letters from Suhail
  renderMailbox(); // Task 10: flag rises while a letter is unread
  announceNewLetters(); // Task 10: envelope flies when a letter newly unlocks
  const _mb = $("mailbox");
  if (_mb) {
    _mb.addEventListener("click", openMailbox);
    _mb.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openMailbox(); }
    });
  }
  const _mu = $("music-btn");
  if (_mu) _mu.addEventListener("click", toggleMusic);
  setMusicIcon();
  const _au = $("garden-audio");
  if (_au) _au.addEventListener("error", () => { musicMode = "synth"; }, { once: true });
  const _st = $("shop-toggle");
  if (_st) _st.addEventListener("click", toggleShop);
  if (_overnight.blooms.length) showOvernight(_overnight);
  const _oc = $("overnight-close");
  if (_oc) _oc.addEventListener("click", hideOvernight);
  // Task 10: Escape closes the overnight modal (guarded: old test
  // harnesses have no document.addEventListener).
  if (typeof document.addEventListener === "function") {
    document.addEventListener("keydown", (e) => { if (e && e.key === "Escape") hideOvernight(); });
  }
  setTimeOfDay();
  syncThemeBtn();
  applyTodayEvents(); // Task 8: today's weather, rain watering, surprise
  $("theme-btn").addEventListener("click", toggleMoonlight);
  // Preview/demo hook (Task 11): #preview, #demo=garden, or CONFIG.previewAll
  // shows a mature garden in memory only — nothing is saved while preview
  // is on (saveState is a no-op), so her real garden is never touched.
  if (isPreviewMode()) {
    state.unlocked.plots = 6;
    state.unlocked.species = Object.keys(PLANTS);
    state.level = 10; // preview: every level gate open
    state.xp = LEVEL_XP[LEVEL_XP.length - 1];
    state.unlocked.decorations = Object.keys(SHOP);
    state.starlight = 500; // preview: enough to try the shop
    state.plots = [freshPlot(), freshPlot(), freshPlot(), freshPlot(), freshPlot(), freshPlot()];
    [["moonflower", 6], ["tulip", 4], ["lavender", 14], ["sunflower", 12], ["nightjasmine", 36], ["cherryblossom", 36]].forEach(([sp, ageH], i) => {
      state.plots[i].species = sp;
      state.plots[i].plantedAt = Date.now() - ageH * HOUR;
      state.plots[i].lastCareAt = Date.now();
    });
    buildScene();
    renderPlants();
    renderCareBar();
    renderHUD();
    renderPlotBuy(); // preview sets level 10 + 6 beds — the button must re-render too
    renderShop();
    renderDecorations();
    renderLetters();
    renderMailbox();
    toast("Preview mode — nothing is saved 👀");
  }
}
