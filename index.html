<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Our Garden 🌹 — for Saniya</title>
<style>
  /* ============================================================
     🌹 ROSE GARDEN FOR HER — STYLES
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-page: #f6efe6;
    --text-main: #4a382e;
    --text-muted: #8a6d59;
    --text-heading: #5c3826;
    --card-bg: rgba(255, 253, 248, 0.92);
    --card-border: #ebd9c5;
    --card-shadow: 0 8px 24px rgba(120, 72, 40, 0.08);
    --rose-pink: #ff9ebb;
    --rose-deep: #e6395f;
    --rose-dark: #b82346;
    --gold: #d4a359;
    --gold-light: #fbe3a9;
    --focus-ring: #e6395f;
  }

  :root[data-theme="dark"] {
    --bg-page: #191024;
    --text-main: #f5e8f0;
    --text-muted: #bfa4b8;
    --text-heading: #fcecf4;
    --card-bg: rgba(38, 24, 48, 0.92);
    --card-border: #4a3258;
    --card-shadow: 0 8px 26px rgba(0, 0, 0, 0.35);
    --rose-pink: #f285ad;
    --rose-deep: #ff4d79;
    --rose-dark: #cc2550;
    --gold: #e2b76c;
    --gold-light: #523b20;
    --focus-ring: #ff759d;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    transition: background 0.5s ease, color 0.5s ease;
    overflow-x: hidden;
  }

  #app {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px 48px;
    position: relative;
  }

  /* Top actions (Music, Moonlight, Fullscreen) */
  #top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .action-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-main);
    font-size: 19px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(120, 72, 40, 0.12);
    transition: transform 0.2s ease, background 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:active { transform: scale(0.92); }
  .action-btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 3px;
  }

  #preview-banner {
    display: none;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #b02348;
    background: #ffe3ec;
    border: 1px solid #ffb3c9;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
    line-height: 1.4;
  }

  header {
    text-align: center;
    margin-bottom: 8px;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 34px;
    color: var(--text-heading);
    letter-spacing: 0.5px;
    font-weight: normal;
  }
  header h1 .heart { color: var(--rose-deep); }
  #for-line {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 16px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  #stage-label {
    font-size: 14px;
    color: var(--rose-deep);
    margin-top: 6px;
    min-height: 22px;
    font-weight: 600;
  }

  /* Scene & Artwork */
  #scene-wrap {
    position: relative;
    margin-top: 10px;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 16px 44px rgba(120, 72, 40, 0.2);
    border: 6px solid rgba(255, 255, 255, 0.7);
    transition: border-color 0.5s ease;
  }
  :root[data-theme="dark"] #scene-wrap {
    border-color: rgba(75, 52, 90, 0.7);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
  }
  /* Elegant inner gold border */
  #scene-wrap::before {
    content: "";
    position: absolute;
    inset: 9px;
    z-index: 4;
    border: 1.5px solid rgba(216, 178, 106, 0.65);
    border-radius: 17px;
    pointer-events: none;
  }
  svg#scene { display: block; width: 100%; height: auto; }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(74,42,24,0.24) 100%);
  }
  #grain-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.42;
    z-index: 3;
  }
  #fx-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 6;
  }
  #glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.5s ease;
    z-index: 1;
    background: radial-gradient(ellipse at 50% 60%, rgba(255,214,140,0.65), rgba(255,214,140,0) 70%);
  }
  #scene-wrap.glorious #glow { opacity: 1; }

  /* Ambient animations */
  .petal {
    position: absolute;
    top: -18px;
    width: 13px;
    height: 15px;
    border-radius: 60% 40% 60% 40%;
    background: #ffb3cb;
    opacity: 0.92;
    animation: petal-fall linear forwards;
    filter: drop-shadow(0 2px 4px rgba(230,57,95,0.25));
  }
  .leafp {
    position: absolute;
    top: -14px;
    width: 11px;
    height: 14px;
    border-radius: 60% 10% 60% 10%;
    background: #d8a05e;
    opacity: 0.9;
    animation: petal-fall linear forwards;
  }
  @keyframes petal-fall {
    0% { transform: translateY(-18px) rotate(0deg); opacity: 0; }
    15% { opacity: 0.95; }
    100% { transform: translateY(520px) rotate(350deg); opacity: 0; }
  }

  .heartf {
    position: absolute;
    color: #ff6b9d;
    text-shadow: 0 0 10px rgba(255,107,157,0.7);
    animation: heartup 4.8s ease-out forwards;
    font-family: Georgia, serif;
    user-select: none;
  }
  @keyframes heartup {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-180px) scale(1.3) rotate(14deg); opacity: 0; }
  }

  .firefly {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffe97a;
    box-shadow: 0 0 12px 4px rgba(255,233,122,0.65);
    animation: ffly 7s ease-in-out infinite;
  }
  @keyframes ffly {
    0%,100% { transform: translate(0,0); opacity: 0.25; }
    25% { transform: translate(28px,-32px); opacity: 1; }
    50% { transform: translate(-16px,-60px); opacity: 0.35; }
    75% { transform: translate(-32px,-20px); opacity: 1; }
  }
  .firefly.heart {
    animation: heartpulse 2.6s ease-in-out infinite;
  }
  @keyframes heartpulse {
    0%, 100% { opacity: 0.45; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.22); }
  }

  .drop {
    position: absolute;
    top: 30px;
    width: 10px;
    height: 16px;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: linear-gradient(#85d1f8, #368dce);
    opacity: 0.95;
    transition: transform 0.85s ease-in, opacity 0.85s ease-in;
  }
  .ripple {
    position: absolute;
    width: 28px;
    height: 12px;
    border: 3px solid rgba(133,209,248,0.85);
    border-radius: 50%;
    animation: ripple 1.3s ease-out forwards;
  }
  @keyframes ripple {
    from { transform: scale(0.4); opacity: 1; }
    to { transform: scale(2.8); opacity: 0; }
  }

  .rain {
    position: absolute;
    top: -30px;
    width: 2px;
    height: 30px;
    border-radius: 2px;
    background: linear-gradient(transparent, rgba(175, 212, 245, 0.85));
    animation: rainfall 0.75s linear infinite;
  }
  @keyframes rainfall { to { transform: translateY(580px); } }

  .cloud { animation: drift 36s linear infinite; }
  .cloud.c2 { animation-duration: 52s; animation-delay: -18s; }
  .cloud.c3 { animation-duration: 68s; animation-delay: -36s; }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(520px); } }

  #birds { animation: flyby 28s linear infinite; }
  @keyframes flyby { from { transform: translateX(-90px); } to { transform: translateX(490px); } }

  .star { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

  .smoke { animation: smokeup 4.5s ease-out infinite; transform-box: fill-box; }
  @keyframes smokeup {
    0% { transform: translateY(0) scale(0.7); opacity: 0; }
    25% { opacity: 0.6; }
    100% { transform: translateY(-48px) scale(1.6); opacity: 0; }
  }

  #tree-sway {
    transform-box: view-box;
    transform-origin: 200px 366px;
    animation: sway 7s ease-in-out infinite;
  }
  @keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }

  #tree-bounce {
    transition: transform 1.4s ease, filter 1.4s ease;
    transform-box: view-box;
    transform-origin: 200px 366px;
  }
  #tree-bounce.droopy { transform: scaleY(0.92); filter: saturate(0.8); }
  #tree-bounce.bounce { animation: bounceT 0.95s ease; }
  @keyframes bounceT {
    0% { transform: scale(1); }
    35% { transform: scale(1.07); }
    70% { transform: scale(0.98); }
    100% { transform: scale(1); }
  }

  #swing {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: swingmove 5.5s ease-in-out infinite;
  }
  @keyframes swingmove { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }

  .grass {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: grassway 4.5s ease-in-out infinite;
  }
  @keyframes grassway { 0%,100% { transform: skewX(-4deg); } 50% { transform: skewX(5deg); } }

  .pop {
    animation: pop 0.75s cubic-bezier(0.2, 1.6, 0.4, 1);
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  .wing-l { transform-box: fill-box; transform-origin: 100% 50%; animation: flap 0.42s ease-in-out infinite alternate; }
  .wing-r { transform-box: fill-box; transform-origin: 0% 50%; animation: flap 0.42s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(0.2); } }
  #bfly1 { animation: wander1 16s ease-in-out infinite; }
  #bfly2 { animation: wander2 22s ease-in-out infinite; }
  @keyframes wander1 {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(70px,-46px); }
    50% { transform: translate(20px,-90px); }
    75% { transform: translate(-60px,-40px); }
  }
  @keyframes wander2 {
    0%,100% { transform: translate(0,0); }
    30% { transform: translate(-70px,-60px); }
    60% { transform: translate(-20px,-110px); }
    80% { transform: translate(50px,-50px); }
  }

  .buggy { transform-box: fill-box; transform-origin: center; animation: wiggle 3.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

  #mailbox { cursor: pointer; }
  .env-fly {
    position: absolute;
    left: 79%;
    top: -8%;
    font-size: 32px;
    z-index: 8;
    animation: envdrop 2.2s ease-in forwards;
  }
  @keyframes envdrop {
    0% { top: -8%; opacity: 0; transform: rotate(-14deg); }
    15% { opacity: 1; }
    100% { top: 58%; opacity: 0; transform: rotate(8deg); }
  }

  /* Quote & Science Card */
  #quote {
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 15.5px;
    color: var(--text-muted);
    margin: 16px 8px 0;
    line-height: 1.6;
    min-height: 48px;
  }

  #fact-card {
    margin: 14px 4px 0;
    padding: 16px 18px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  #fact-head {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--gold);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  #fact-title {
    font-family: Georgia, serif;
    font-size: 18px;
    font-weight: bold;
    color: var(--text-heading);
    margin-bottom: 6px;
  }
  #fact-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-main);
  }

  /* Timeline & Progress */
  #timeline { margin: 16px 0 6px; }
  #timeline-cap {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 8px;
  }
  #timeline-track {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 6px 4px 10px;
    scrollbar-width: thin;
  }
  .tdot {
    flex: 0 0 auto;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    background: rgba(255,255,255,0.65);
    transition: all 0.4s ease;
  }
  :root[data-theme="dark"] .tdot { background: rgba(255,255,255,0.08); }
  .tdot.done {
    background: radial-gradient(circle at 35% 35%, #ff9ebb, var(--rose-deep));
    border-color: var(--rose-dark);
    box-shadow: 0 0 8px rgba(230,57,95,0.55);
  }
  .tdot.next {
    border-color: #64b958;
    animation: dotpulse 1.8s ease-in-out infinite;
  }
  @keyframes dotpulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(100,185,88,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(100,185,88,0); }
  }

  #progress-wrap { margin: 6px 0 10px; }
  #day-text {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 6px;
  }
  #progress-bar {
    height: 10px;
    background: rgba(255,255,255,0.7);
    border-radius: 99px;
    overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
  }
  :root[data-theme="dark"] #progress-bar { background: rgba(255,255,255,0.14); }
  #progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #ffb3cb, var(--rose-deep));
    transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Water Button */
  #water-btn {
    display: block;
    width: 100%;
    margin: 14px 0 12px;
    padding: 17px;
    font-size: 17.5px;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 99px;
    background: linear-gradient(135deg, #57b764, #278637);
    box-shadow: 0 8px 24px rgba(39, 134, 55, 0.4), inset 0 1px 0 rgba(255,255,255,0.35);
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.3s ease, background 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  #water-btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    animation: btnshine 3.5s ease-in-out infinite;
  }
  @keyframes btnshine {
    0%,60% { left: -60%; }
    100% { left: 140%; }
  }
  #water-btn:active { transform: scale(0.97); }
  #water-btn:disabled {
    filter: grayscale(0.5) brightness(1.02);
    cursor: default;
    background: #6a8c71;
    box-shadow: none;
  }
  :root[data-theme="dark"] #water-btn:disabled { background: #324338; }
  #water-btn:disabled::after { display: none; }

  /* Note Box */
  #note-box {
    margin-bottom: 14px;
    background: var(--card-bg);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: var(--card-shadow);
    border: 1px solid var(--card-border);
  }
  #note-box label {
    font-size: 13px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
  }
  #note-input {
    width: 100%;
    min-height: 58px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    color: var(--text-main);
  }
  :root[data-theme="dark"] #note-input { background: rgba(255, 255, 255, 0.06); }
  #note-input:focus {
    outline: 2px solid var(--rose-pink);
    border-color: transparent;
  }

  /* Sealed Milestone Letters */
  #his-letters, #letters { margin-top: 22px; }
  #his-letters h2, #letters h2 {
    font-family: Georgia, serif;
    font-size: 20px;
    color: var(--text-heading);
    margin-bottom: 12px;
    text-align: center;
  }
  .letter {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 15px 18px;
    margin-bottom: 14px;
    box-shadow: var(--card-shadow);
    border: 1px solid var(--card-border);
    position: relative;
    transition: transform 0.2s ease;
  }
  .letter::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 4px;
    border-radius: 4px;
    background: linear-gradient(var(--rose-pink), var(--rose-deep));
  }
  .letter.locked {
    opacity: 0.75;
    background: rgba(230, 220, 210, 0.4);
    border-style: dashed;
  }
  :root[data-theme="dark"] .letter.locked { background: rgba(30, 20, 40, 0.4); }
  .letter.locked::before { background: #b09e90; }
  .letter .day {
    font-size: 13px;
    font-weight: 800;
    color: var(--rose-dark);
    margin-bottom: 6px;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .letter.locked .day { color: var(--text-muted); }
  .letter .text {
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-line;
    color: var(--text-main);
    font-family: Georgia, serif;
  }
  #no-letters {
    font-size: 13.5px;
    color: var(--text-muted);
    font-style: italic;
    text-align: center;
    padding: 12px;
  }

  /* Memory Photos */
  #bush1, #bush2, #bush3 { cursor: pointer; }
  .photo-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .photo-add {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    cursor: pointer;
    background: rgba(212, 163, 89, 0.12);
    padding: 6px 12px;
    border-radius: 99px;
    border: 1px dashed var(--gold);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .photo-thumb {
    width: 58px;
    height: 58px;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid var(--card-border);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.2s ease;
  }
  .photo-thumb:hover { transform: scale(1.05); }

  /* Buttons & Ghost buttons */
  #letters-actions { text-align: center; margin: 4px 0 14px; }
  .ghost-btn {
    padding: 10px 20px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-muted);
    background: transparent;
    border: 1.5px solid var(--card-border);
    border-radius: 99px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .ghost-btn:hover { background: rgba(255,255,255,0.4); border-color: var(--rose-pink); }
  .ghost-btn:active { transform: scale(0.95); }
  #garden-care {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: var(--text-muted);
    font-family: Georgia, serif;
    font-style: italic;
  }

  /* Overlays (Intro, Finale, Lightbox) */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(45, 20, 28, 0.55);
    backdrop-filter: blur(8px);
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    background: linear-gradient(180deg, var(--card-bg), #fff5ea);
    border-radius: 26px;
    padding: 34px 28px;
    max-width: 410px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.35);
    max-height: 88vh;
    overflow-y: auto;
    border: 1px solid var(--card-border);
  }
  :root[data-theme="dark"] .card {
    background: linear-gradient(180deg, var(--card-bg), #22142d);
  }
  .card h2 {
    font-family: Georgia, serif;
    font-size: 28px;
    color: var(--text-heading);
    margin-bottom: 14px;
  }
  .card h2 .heart { color: var(--rose-deep); }

    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Organic wobble path generator for storybook illustrations
function blobPath(cx, cy, r, irr, n, seed) {
  const rnd = mulberry32(seed);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = r * (1 - irr / 2 + rnd() * irr);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * (0.85 + rnd() * 0.3)]);
  }
  let d = "";
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    if (i === 0) d = "M" + mx.toFixed(1) + "," + my.toFixed(1);
    else d += " Q" + p[0].toFixed(1) + "," + p[1].toFixed(1) + " " + mx.toFixed(1) + "," + my.toFixed(1);
  }
  const p0 = pts[0], pn = pts[n - 1];
  const mx = (pn[0] + p0[0]) / 2, my = (pn[1] + p0[1]) / 2;
  d += " Q" + pn[0].toFixed(1) + "," + pn[1].toFixed(1) + " " + mx.toFixed(1) + "," + my.toFixed(1) + " Z";
  return d;
}

function blob(parent, cx, cy, r, fill, seed, irr, ink) {
  const p = el("path", { d: blobPath(cx, cy, r, irr || 0.35, 9, seed), fill }, parent);
  if (ink) {
    p.setAttribute("stroke", ink);
    p.setAttribute("stroke-width", "2");
    p.setAttribute("stroke-opacity", "0.3");
    p.setAttribute("stroke-linejoin", "round");
  }
  return p;
}

/* ---------------- Time of day ambient tinting ---------------- */
function setTimeOfDay() {
  const h = new Date().getHours();
  const wrap = $("scene-wrap");
  let sky, veil, sun, moon, clouds, birds, night;
  if (h >= 5 && h < 8) {
    // Dawn
    sky = "linear-gradient(180deg, #ffc9de 0%, #ffe3c8 55%, #fff3dd 100%)";
    veil = 0; sun = true; moon = false; clouds = true; birds = true; night = false;
  } else if (h >= 8 && h < 16) {
    // Day
    sky = "linear-gradient(180deg, #8fd4ff 0%, #cdeffb 55%, #f2fbff 100%)";
    veil = 0; sun = true; moon = false; clouds = true; birds = true; night = false;
  } else if (h >= 16 && h < 19) {
    // Golden hour / Dusk
    sky = "linear-gradient(180deg, #ff9d6b 0%, #ffc98f 50%, #ffe9c4 100%)";
    veil = 0.08; sun = true; moon = false; clouds = true; birds = true; night = false;
  } else {
    // Night
    sky = "linear-gradient(180deg, #10142e 0%, #232a52 55%, #3a3f66 100%)";
    veil = 0.42; sun = false; moon = true; clouds = false; birds = false; night = true;
  }
  wrap.style.background = sky;
  $("night-veil").setAttribute("opacity", veil);
  $("sun").style.display = sun ? "" : "none";
  $("moon").style.display = moon ? "" : "none";
  $("clouds").style.display = clouds ? "" : "none";
  $("birds").style.display = birds ? "" : "none";
  $("bfly1").style.display = night ? "none" : "";
  $("bfly2").style.display = night ? "none" : "";
  document.querySelectorAll("[data-star]").forEach(s => { s.style.display = night ? "" : "none"; });
  document.querySelectorAll(".dapple").forEach(d => { d.style.display = night ? "none" : ""; });
  document.querySelectorAll(".cottage-window").forEach(w => {
    w.setAttribute("fill", night ? "#ffd97a" : "#8fa3b8");
  });
  return night;
}

/* ============================================================
   9. CORE LOOP, STAGES & RENDERING
   ============================================================ */
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 3200);
}

function stageName(d) {
  if (d === 0) return "Preparing the garden for you…";
  if (d <= 3) return "Your love is sprouting 🌱";
  if (d <= 8) return "Growing stronger every day";
  if (d <= 17) return "Reaching for the sky 🌳";
  if (d <= 24) return "Blossoming, just like us 🌸";
  if (d < CONFIG.gardenDays) return "The roses are waking up 🌹";
  if (d === CONFIG.gardenDays) return "Our forever rose garden 🌹🌹🌹";
  return "Ever after 🌹";
}

function show(elm, visible, popIt) {
  if (!elm) return;
  const wasHidden = elm.style.display === "none";
  elm.style.display = visible ? "" : "none";
  if (visible && popIt && wasHidden) {
    elm.classList.remove("pop");
    void elm.getBoundingClientRect();
    elm.classList.add("pop");
  }
}

function buildTimeline() {
  const track = $("timeline-track");
  track.innerHTML = "";
  for (let i = 1; i <= CONFIG.gardenDays; i++) {
    const dot = document.createElement("div");
    dot.className = "tdot";
    dot.id = "tdot-" + i;
    dot.title = "Day " + i;
    track.appendChild(dot);
  }
}

function render() {
  const d = daysWatered();
  const total = CONFIG.gardenDays;

  // Header & Stage
  $("stage-label").textContent = stageName(d);
  $("for-line").textContent = "for " + CONFIG.herName + " ♥";
  $("day-text").textContent = d > total
    ? "Day " + d + " of our garden 🌹"
    : "Day " + Math.min(d, total) + " of " + total;
  $("progress-fill").style.width = Math.min(100, (d / total) * 100) + "%";

  // Timeline dots
  for (let i = 1; i <= total; i++) {
    const dot = $("tdot-" + i);
    if (!dot) continue;
    dot.classList.toggle("done", i <= d);
    dot.classList.toggle("next", i === d + 1 && !PREVIEW);
  }
  const nextDot = $("tdot-" + Math.min(d + 1, total));
  if (nextDot && !PREVIEW) nextDot.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });

  // Growth layers
  show($("seed"), d === 0);
  show($("sprout"), d >= 1 && d <= 3, true);
  show($("tree"), d >= 4);
  if (d >= 4) {
    const s = 0.35 + 0.65 * (Math.min(d, total) / total);

      div.appendChild(day);

      list.appendChild(div);

    milestoneKeys().forEach(k => {
      const m = CONFIG.milestones[k];
      const open = d >= k;
      const div = document.createElement("div");
      div.className = "letter" + (open ? "" : " locked");

      const t = document.createElement("div");
      t.className = "day";
      t.textContent = open ? m.title : "🔒 Opens on day " + k;
      div.appendChild(t);

      if (open) {
        const tx = document.createElement("div");

        tx.textContent = m.text;
        div.appendChild(tx);
      }

      // Memory photo affordance
      const prow = document.createElement("div");
      prow.className = "photo-row";
      const storedPhotos = (state.photos || {})[k];
      const photosArr = Array.isArray(storedPhotos) ? storedPhotos : (storedPhotos ? [storedPhotos] : []);

      photosArr.forEach((ph, pIdx) => {
        const th = document.createElement("img");

        th.alt = "Memory photo, day " + k + " #" + (pIdx + 1);

        prow.appendChild(th);
      });

      if (open) {
        const lab = document.createElement("label");

        lab.textContent = photosArr.length ? "📷 Add another memory photo" : "📷 Add a memory photo";
        const inp = document.createElement("input");
        inp.type = "file";

        prow.appendChild(lab);

  // Footer & Sign
  $("footer").textContent = "grown with love by " + CONFIG.yourName + " · for " + CONFIG.herName + " ♥";
  $("sign-text").textContent = CONFIG.herName + " ♥";

  // Daily Quote & Science Fact
  const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 864e5);
  $("quote").textContent = "“" + QUOTES[dayOfYear % QUOTES.length] + "”";

  const fi = (Math.max(1, d) - 1) % LOVE_FACTS.length;
  const F = LOVE_FACTS[fi];
  $("fact-head").textContent = "📖 DAY " + Math.max(1, d) + " · A LITTLE LOVE SCIENCE";
  $("fact-title").textContent = F.t;
  $("fact-text").textContent = F.x;

  if (d >= total) celebrate();

/* ============================================================
   10. MUSIC & WEBAUDIO MUSIC-BOX LULLABY
   ============================================================ */
let audioCtx = null, musicBus = null, musicTimer = null, musicPlaying = false;
let musicMode = "mp3"; // "mp3" or fallback "synth"

const NOTE_FREQ = {
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.0, B5: 987.77, C6: 1046.5,
  G2: 98.0, A2: 110.0, C3: 130.81, F2: 87.31
};

// 3/4 waltz "written for Saniya", ~24-beat melody + bassline with feedback-delay echo
const LULLABY = [
  ["E5",1],["G5",1],["C6",1],
  ["B5",1],["A5",1],["G5",1],
  ["A5",1],["C6",1],["B5",1],
  ["G5",2],["E5",1],
  ["F5",1],["E5",1],["D5",1],
  ["E5",1],["D5",1],["C5",1],
  ["D5",1],["E5",1],["G5",1],
  ["C6",2.5],[null,0.5]
];
const BASSLINE = [
  ["C3",3],["G2",3],["A2",3],["C3",3],
  ["F2",3],["G2",3],["C3",3],["C3",3]
];
const BEAT = 0.52;

function ensureAudio() {
  if (audioCtx) return true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    return false;
  }
  musicBus = audioCtx.createGain();
  const delay = audioCtx.createDelay(1);
  delay.delayTime.value = 0.35;
  const fb = audioCtx.createGain();
  fb.gain.value = 0.33;
  const wet = audioCtx.createGain();
  wet.gain.value = 0.35;

  musicBus.connect(audioCtx.destination);
  musicBus.connect(delay);
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(wet);
  wet.connect(audioCtx.destination);
  return true;
}

function musicNote(freq, when, dur, vol, bright) {
  const t = audioCtx.currentTime + when;
  const o1 = audioCtx.createOscillator();
  const o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const g2 = audioCtx.createGain();

  o1.type = "triangle";
  o1.frequency.value = freq;
  o2.type = "sine";
  o2.frequency.value = freq * 2;
  g2.gain.value = bright ? 0.22 : 0.08;

  o1.connect(g);
  o2.connect(g2);
  g2.connect(g);
  g.connect(musicBus);

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 1.6));
  o1.start(t);
  o2.start(t);
  o1.stop(t + Math.max(dur, 1.7));
  o2.stop(t + Math.max(dur, 1.7));
}

function playLullabyOnce() {
  let when = 0.05;
  LULLABY.forEach(([n, b]) => {
    if (n) musicNote(NOTE_FREQ[n], when, b * BEAT, 0.2, true);
    when += b * BEAT;
  });
  const end = when;
  let bw = 0.05;
  BASSLINE.forEach(([n, b]) => {
    musicNote(NOTE_FREQ[n], bw, b * BEAT, 0.09, false);
    bw += b * BEAT;
  });
  return Math.max(end, bw);
}

function setMusicIcon() {
  const btn = $("music-btn");
  const playing = musicMode === "mp3" ? !$("garden-audio").paused : musicPlaying;
  btn.textContent = playing ? "⏸" : "🎵";
  btn.setAttribute("aria-label", playing ? "Pause music" : "Play lullaby");
}

function toggleSynth() {
  if (!ensureAudio()) { toast("Audio not supported here"); return; }
  if (audioCtx.state === "suspended") audioCtx.resume();
  musicPlaying = !musicPlaying;
  if (musicPlaying) {
    const loop = () => {
      if (!musicPlaying) return;
      const total = playLullabyOnce();
      musicTimer = setTimeout(loop, total * 1000 + 800);
    };
    loop();
  } else {
    clearTimeout(musicTimer);
  }
  setMusicIcon();
}

function toggleMusic() {
  if (musicMode === "mp3") {
    const a = $("garden-audio");
    if (a.paused) {
      const pr = a.play();
      if (pr && pr.then) {
        pr.then(setMusicIcon).catch(() => {
          musicMode = "synth";
          toggleSynth();
        });
      } else {
        setMusicIcon();
      }
    } else {
      a.pause();
      setMusicIcon();
    }
  } else {
    toggleSynth();
  }
}

let activePhotos = [], activeIdx = 0;

function getAllPhotos() {
  const list = [];
  const pKeys = Object.keys(state.photos || {}).map(Number).sort((a, b) => a - b);
  pKeys.forEach(day => {
    const val = state.photos[day];
    const arr = Array.isArray(val) ? val : [val];
    arr.forEach((src, idx) => {
      list.push({ day, src, title: "Day " + day + " Memory" });
    });
  });
  return list;
}

function openPhotoViewer(day, photoIndex) {
  activePhotos = getAllPhotos();
  if (!activePhotos.length) {
    toast("No memory photos yet — add one to an open letter 📷");
    return;
  }
  if (day !== undefined) {
    const matchIdx = activePhotos.findIndex(p => p.day === Number(day));
    activeIdx = matchIdx >= 0 ? matchIdx + (photoIndex || 0) : 0;
  } else {
    activeIdx = 0;
  }
  pvShow();
  $("photo-viewer").classList.remove("hidden");
}

function pvShow() {
  const p = activePhotos[activeIdx];
  if (!p) return;
  $("pv-img").src = p.src;
  $("pv-cap").textContent = "Day " + p.day + (activePhotos.length > 1 ? " · Photo " + (activeIdx + 1) + " of " + activePhotos.length : "");
  const multi = activePhotos.length > 1;
  $("pv-prev").style.display = multi ? "" : "none";
  $("pv-next").style.display = multi ? "" : "none";
}

function handlePhoto(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const day = input.dataset.day;
  const img = new Image();
  img.onload = () => {
    const MAX = 900;
    const sc = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width * sc));
    c.height = Math.max(1, Math.round(img.height * sc));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    try {
      state.photos = state.photos || {};
      const existing = state.photos[day];
      const arr = Array.isArray(existing) ? existing : (existing ? [existing] : []);
      arr.push(c.toDataURL("image/jpeg", 0.82));
      state.photos[day] = arr;
      store.save(state);
      render();
      toast("Memory saved 📷");
    } catch (e) {
      toast("Photo is too big to store 📷");
    }
  };
  img.onerror = () => toast("Couldn't read that photo 📷");
  img.src = URL.createObjectURL(file);
  input.value = "";
}

   13. BACKUP, RESTORE & SHARE
   ============================================================ */
function downloadBackup() {
  const payload = {
    app: "our-garden",
    version: 1,
    exportedAt: new Date().toISOString(),
    herName: CONFIG.herName,
    state: {
      watered: state.watered,
      notes: state.notes,
      started: state.started,
      finaleSeen: state.finaleSeen,
      announcedMs: state.announcedMs || [],
      readMs: state.readMs || [],
      photos: state.photos || {}
    }
  };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const a = document.createElement("a");
  const t = new Date(), pad = (n) => String(n).padStart(2, "0");
  a.href = URL.createObjectURL(blob);
  a.download = "our-garden-backup-" + t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()) + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600);
  toast("Garden saved 💾 — keep it somewhere safe");
}

function restoreBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || data.app !== "our-garden" || !data.state) throw new Error("bad file");
      const s = data.state;
      state = {
        watered: Array.isArray(s.watered) ? s.watered : [],
        notes: Array.isArray(s.notes) ? s.notes : [],
        started: s.started || null,
        finaleSeen: !!s.finaleSeen,
        announcedMs: Array.isArray(s.announcedMs) ? s.announcedMs : [],
        readMs: Array.isArray(s.readMs) ? s.readMs : [],
        photos: (s.photos && typeof s.photos === "object") ? s.photos : {}
      };
      store.save(state);
      render();
      toast("Garden restored 🌱 — welcome back");
    } catch (e) {
      toast("That file isn't a garden backup 💾");
    }
  };
  r.onerror = () => toast("Couldn't read that file 💾");
  r.readAsText(file);
}

function shareLetters() {
  const notes = state.notes || [];
  if (!notes.length) {
    toast("No letters to send yet 💌");
    return;
  }
  const photoCount = getAllPhotos().length;
  let text = "💌 Letters from " + CONFIG.herName + "'s garden\n\n";
  [...notes].forEach(n => {
    text += "Day " + n.day + " · " + n.date + "\n" + n.text + "\n\n";
  });
  if (photoCount) {
    text += "📷 " + photoCount + " memory photo" + (photoCount > 1 ? "s" : "") + " tucked into the garden\n\n";
  }
  text += "— grown with love by " + CONFIG.yourName;

  if (navigator.share) {
    navigator.share({ title: "Letters from our garden", text }).catch(() => {});
  } else if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => toast("Copied — paste it to " + CONFIG.yourName + " 💌"))
      .catch(() => toast("Couldn't copy — copy manually 💌"));
  } else {
    toast("Copy the letters from the garden to share 💌");
  }
}

// Theme setup
(function initTheme() {
  const btn = $("theme-btn");
  const apply = (t) => {
    document.documentElement.dataset.theme = t;
    btn.textContent = t === "dark" ? "☀️" : "🌙";
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to moonlight theme");
    try { localStorage.setItem("our-garden-theme", t); } catch (e) {}
  };
  let saved = "light";
  try { saved = localStorage.getItem("our-garden-theme") || "light"; } catch (e) {}
  apply(saved);
  btn.addEventListener("click", () => {
    apply(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
})();

// Fullscreen setup
(function initFullscreen() {
  const b = $("fsb");
  if (!document.fullscreenEnabled) {
    b.style.display = "none";
    return;
  }
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (_) {}
  });
  document.addEventListener("fullscreenchange", () => {
    const fs = !!document.fullscreenElement;
    b.textContent = fs ? "✕" : "⛶";
  });
})();

// Intro setup
$("intro-title").textContent = CONFIG.introTitle;
$("intro-text").textContent = CONFIG.introText;
$("water-btn").addEventListener("click", doWater);
$("plant-btn").addEventListener("click", () => {
  $("intro").classList.add("hidden");
  doWater();
});

$("finale-close").addEventListener("click", () => $("finale").classList.add("hidden"));

// Mailbox click
$("mailbox").addEventListener("click", () => {
  const d = daysWatered();
  state.readMs = [...new Set([...(state.readMs || []), ...milestoneKeys().filter(k => d >= k)])];
  store.save(state);
  render();
  const hl = $("his-letters");
  if (hl) hl.scrollIntoView({ behavior: "smooth", block: "start" });
  toast("Opening letters from Suhail 💌");
});

// Music & fallback
$("music-btn").addEventListener("click", toggleMusic);
$("garden-audio").addEventListener("error", () => {
  musicMode = "synth";
}, { once: true });

// Milestone photo inputs
$("his-letters-list").addEventListener("change", (e) => {
  if (e.target && e.target.matches('input[type="file"]')) handlePhoto(e.target);
});

// Rose bushes click -> photo viewer
["bush1", "bush2", "bush3"].forEach(id => {
  const b = $(id);
  if (b) b.addEventListener("click", () => openPhotoViewer());
});

// Lightbox navigation
$("pv-close").addEventListener("click", () => $("photo-viewer").classList.add("hidden"));
$("pv-prev").addEventListener("click", () => {
  activeIdx = (activeIdx - 1 + activePhotos.length) % activePhotos.length;
  pvShow();
});
$("pv-next").addEventListener("click", () => {
  activeIdx = (activeIdx + 1) % activePhotos.length;
  pvShow();
});

// Keyboard controls for modal/lightbox
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    $("photo-viewer").classList.add("hidden");
    $("intro").classList.add("hidden");
    $("finale").classList.add("hidden");
  } else if (!$("photo-viewer").classList.contains("hidden")) {
    if (e.key === "ArrowLeft") $("pv-prev").click();
    else if (e.key === "ArrowRight") $("pv-next").click();
  }
});

// Backup & share buttons
$("backup-btn").addEventListener("click", downloadBackup);
$("restore-btn").addEventListener("click", () => $("restore-input").click());
$("restore-input").addEventListener("change", (e) => {
  restoreBackup(e.target.files[0]);
  e.target.value = "";
});
$("share-letters").addEventListener("click", shareLetters);

// Boot
IS_NIGHT = setTimeOfDay();
render();
startAmbient(IS_NIGHT);

if (!PREVIEW && !state.started) {
  $("intro").classList.remove("hidden");
}
